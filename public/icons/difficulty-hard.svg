<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" shape-rendering="crispEdges">
  <!-- Retro pixel-art intense gamer face matching mockup -->
  <!-- Hair -->
  <rect x="24" y="14" width="48" height="16" fill="#6E4627"/>
  <rect x="20" y="20" width="56" height="10" fill="#5B391F"/>
  <rect x="28" y="12" width="40" height="4" fill="#825634"/>
  <!-- Face -->
  <rect x="22" y="28" width="52" height="52" rx="4" fill="#D9A382"/>
  <rect x="26" y="30" width="44" height="46" fill="#E3B192"/>
  <!-- Ears -->
  <rect x="18" y="42" width="4" height="14" fill="#C48966"/>
  <rect x="74" y="42" width="4" height="14" fill="#C48966"/>
  <!-- Intense brows & red-tinted eyes -->
  <rect x="28" y="38" width="14" height="5" fill="#4E301B"/>
  <rect x="54" y="38" width="14" height="5" fill="#4E301B"/>
  <rect x="30" y="43" width="12" height="7" fill="#FFFFFF"/>
  <rect x="54" y="43" width="12" height="7" fill="#FFFFFF"/>
  <rect x="34" y="44" width="5" height="5" fill="#B91C1C"/>
  <rect x="57" y="44" width="5" height="5" fill="#B91C1C"/>
  <!-- Nose -->
  <rect x="44" y="48" width="8" height="10" fill="#C78A68"/>
  <!-- Grinning teeth -->
  <rect x="30" y="64" width="36" height="10" fill="#3B1D14"/>
  <rect x="32" y="65" width="32" height="8" fill="#F7F4EE"/>
  <rect x="39" y="65" width="2" height="8" fill="#8A6E5E"/>
  <rect x="47" y="65" width="2" height="8" fill="#8A6E5E"/>
  <rect x="55" y="65" width="2" height="8" fill="#8A6E5E"/>
  <!-- Chin shadow -->
  <rect x="30" y="76" width="36" height="4" fill="#B97D5B"/>
</svg>
