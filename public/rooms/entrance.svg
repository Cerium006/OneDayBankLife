  <rect x="756" y="310" width="12" height="44" rx="3" fill="#334155"/>
  <rect x="832" y="310" width="12" height="44" rx="3" fill="#334155"/>

  <!-- Турникет в центре (x:38% y:54% w:22% h:28%) -->
