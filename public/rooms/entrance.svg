  <circle cx="643" cy="548" r="14" fill="#22C55E"/>

  <!-- Охранник Виктор (x:23% y:32% w:13% h:48%) -->
  <circle cx="472" cy="348" r="44" fill="#FDE68A" stroke="#0F172A" stroke-width="3"/>
  <rect x="412" y="400" width="120" height="200" rx="20" fill="#1E3A8A" stroke="#0F172A" stroke-width="3"/>
