<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <!-- Стена и стекло окна обслуживания -->
  <polygon points="0,0 1600,0 1440,140 160,140" fill="#FFFFFF" fill-opacity="0.35" stroke="#64748B" stroke-width="2"/>
  <rect x="160" y="140" width="1280" height="360" fill="#FFFFFF" fill-opacity="0.45" stroke="#64748B" stroke-width="2"/>

  <!-- Столешница рабочего места менеджера -->
  <polygon points="80,500 1520,500 1600,900 0,900" fill="#FFFFFF" fill-opacity="0.92" stroke="#334155" stroke-width="4"/>

  <!-- Кассир Олег (x:16% y:30% w:14% h:48%) -->
  <circle cx="368" cy="336" r="42" fill="#FDE68A" stroke="#0F172A" stroke-width="3"/>
  <rect x="308" y="388" width="120" height="190" rx="18" fill="#0F766E" stroke="#0F172A" stroke-width="3"/>

  <!-- Монитор менеджера (x:35% y:36% w:22% h:27%) -->
  <rect x="560" y="324" width="352" height="214" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
  <rect x="580" y="344" width="312" height="174" rx="4" fill="#E0F2FE"/>
  <rect x="706" y="538" width="60" height="30" fill="#475569"/>
  <rect x="666" y="564" width="140" height="14" rx="4" fill="#334155"/>

  <!-- Лоток с документами (x:60% y:56% w:16% h:18%) -->
  <rect x="960" y="504" width="256" height="162" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="3"/>
  <rect x="984" y="526" width="160" height="114" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <line x1="1006" y1="556" x2="1120" y2="556" stroke="#64748B" stroke-width="3"/>
  <line x1="1006" y1="586" x2="1100" y2="586" stroke="#64748B" stroke-width="3"/>

  <!-- Сканер карт и паспортов (x:78% y:52% w:13% h:20%) -->
  <rect x="1248" y="468" width="208" height="180" rx="10" fill="#475569" stroke="#0F172A" stroke-width="3"/>
  <rect x="1276" y="494" width="152" height="90" rx="6" fill="#0EA5E9" fill-opacity="0.45" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="590" y="34" width="420" height="54" rx="8" fill="#0F172A" fill-opacity="0.72"/>
  <text x="800" y="69" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">ОКНО ОБСЛУЖИВАНИЯ</text>
</svg>
